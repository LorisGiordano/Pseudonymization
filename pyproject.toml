[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dicom_pseudo.core" = ["config/*.json"]


[project]
name = "dicom_pseudo"
version = "0.2.0"
authors = [
  { name="Loris Giordano", email="loris.giordano@vub.be" },
]
description = "Utilities for pseudonymizing DICOM datasets."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "pandas >= 2.1",
  "pydicom >= 2.4",
  "openpyxl >= 3.1",
  "tqdm >= 4.66",
  "dicom2nifti >= 2.4",
  "nibabel >= 5.0",
  "numpy >= 1.24",
]

[project.optional-dependencies]
# redaction of text burned into the pixel data (also requires: python -m spacy download en_core_web_lg, and Tesseract OCR)
presidio = [
  "presidio-image-redactor >= 0.0.53",
]
# tests (pytest)
test = [
  "pytest >= 8",
]

[project.scripts]
pseudonymize = "dicom_pseudo.pseudonymization:main"
extract = "dicom_pseudo.extraction:main"
compare = "dicom_pseudo.compare_nifti:main"
redact = "dicom_pseudo.redaction:main"
modify-profile = "dicom_pseudo.modify_profile:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# short tracebacks: test arguments (e.g. DICOM datasets of real data) are not printed in failure reports
addopts = "--tb=short"
markers = [
    "real_data: tests on the real datasets of the _data folder next to the repository (skipped if absent)",
]
